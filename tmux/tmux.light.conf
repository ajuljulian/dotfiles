# Status bar
set -g status-style 'fg=#1e293b,bg=#e2e8f0'

# Window tabs
setw -g window-status-style 'fg=#475569,bg=#e2e8f0'
setw -g window-status-current-style 'fg=#ffffff,bg=#1d4ed8,bold'

# Panes - explicitly set dark foreground
setw -g window-style 'fg=#334155,bg=#f1f5f9'
setw -g window-active-style 'fg=#0f172a,bg=#ffffff'

# Messages
set -g message-style 'fg=#ffffff,bg=#1d4ed8,bold'

# Pane borders
setw -g pane-border-style 'fg=#94a3b8'
setw -g pane-active-border-style 'fg=#2563eb'
