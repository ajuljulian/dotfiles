# Status bar
set -g status-style 'fg=#cbd5e1,bg=#1e293b'

# Window tabs
setw -g window-status-style 'fg=#94a3b8,bg=#1e293b'
setw -g window-status-current-style 'fg=#ffffff,bg=#2563eb,bold'

# Panes - explicitly set readable foreground colors
setw -g window-style 'fg=#94a3b8,bg=#1e293b'
setw -g window-active-style 'fg=#e2e8f0,bg=#0f172a'

# Messages
set -g message-style 'fg=#ffffff,bg=#2563eb,bold'

# Pane borders
setw -g pane-border-style 'fg=#475569,bg=#1e293b'
setw -g pane-active-border-style 'fg=#60a5fa,bg=#0f172a'
